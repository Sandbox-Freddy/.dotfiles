name: Build NixOS hosts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      # The flake's own alejandra, so CI formats with the same version the
      # hosts ship. `nixpkgs#` would be whatever the registry resolves to.
      - name: alejandra --check
        run: nix run .#alejandra -- --check .

  build-x86_64:
    name: Build ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [work, freddy-laptop, thinclient]
    steps:
      - uses: actions/checkout@v6

      - name: "Setup Nix & Cachix"
        uses: ./.github/actions/setup-nix-cachix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: "Build ${{ matrix.host }} configuration"
        uses: ./.github/actions/build-nix-host
        with:
          host: ${{ matrix.host }}
